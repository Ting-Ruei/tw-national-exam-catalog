{
  "schema_version": "ai395_review_pipeline_v1",
  "pipeline_id": "ai395_review_staging",
  "environment": "staging",
  "source_stage": {
    "enabled": false,
    "mode": "existing_artifact",
    "allow_network": false,
    "write_catalog_checkpoint": false,
    "adapter": "existing_artifact",
    "required_contract": "schemas/ai395_review/source-artifact.schema.json"
  },
  "mineru_stage": {
    "enabled": false,
    "mode": "existing_artifact",
    "allow_execution": false,
    "require_existing_output": true,
    "adapter": "existing_artifact",
    "required_contract": "schemas/ai395_review/mineru-artifact.schema.json"
  },
  "parser_stage": {
    "enabled": true,
    "mode": "existing_parser_or_fixture",
    "allow_source_rebuild": false
  },
  "lane_stage": {
    "enabled": true,
    "lanes": ["text_evidence", "notation", "group", "vision", "answer"]
  },
  "revision_stage": {
    "enabled": true,
    "max_revisions_per_candidate": 3,
    "allow_ai_materialization": false,
    "allow_deterministic_fixture_patch": true
  },
  "formal_stage": {
    "enabled": true,
    "dry_run_only": true,
    "production_write": false
  },
  "model_stage": {
    "provider_mode": "mock",
    "allow_live_provider": false,
    "advisory_only": true,
    "context_policy": {
      "hard_limit_tokens": 131072,
      "safety_margin_tokens": 8192,
      "slow_threshold_seconds": 30,
      "max_tool_turns": 1,
      "evidence_cache": "staging_artifact_only",
      "allowlisted_tools": [
        "question_markdown",
        "answer_markdown",
        "adjacent_questions",
        "pdf_reference",
        "image_manifest"
      ]
    }
  }
}
