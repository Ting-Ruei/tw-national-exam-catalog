<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>figure 草案核讀 — 一次一卡</title>
<!--
  figure-missing 證據包草案的核讀頁。資料來源＝`/api/figure`（讀
  figure_missing_second_pass 的 A/B 兩輪輸出＋工單裁片路徑）；裁決＝POST /api/judgement
  （rating＋extras.figure_review）→ `store/agent_feedback.jsonl`（append-only 學習流，
  與 agent 同一條流）。**本頁不寫人審帳本**；落地（G3）另行 owner 核准。
  裁片影像走 `/file`（與 v2 同一個 safe_file_path 契約：queue root 已是 allowed root）。
-->
<style>
:root { --ink:#1b1f24; --muted:#6b7280; --line:#d8dde5; --bg:#f6f8fa; --ok:#1a7f37; --warn:#9a6700; --bad:#b42318; --accent:#0969da; }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.65 -apple-system,"PingFang TC","Noto Sans TC",sans-serif; color:var(--ink); background:var(--bg); }
header { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); padding:10px 16px; }
header h1 { font-size:15px; font-weight:600; margin:0 0 6px; display:flex; gap:10px; align-items:baseline; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:4px 12px; cursor:pointer; }
.chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
main { max-width:960px; margin:12px auto; padding:0 12px; display:grid; gap:14px; }
.card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
.card.done-ok { border-color:var(--ok); }
.card.no-bad { border-color:var(--bad); }
.k { font-size:12.5px; color:var(--muted); word-break:break-all; }
.badge { font-size:12px; border-radius:6px; padding:1px 8px; margin-left:6px; }
.badge.agree { background:#dcf5e2; color:var(--ok); }
.badge.split { background:#ffe3e3; color:var(--bad); }
.badge.ruling-pass { background:#dcf5e2; color:var(--ok); }
.badge.ruling-return { background:#ffe3e3; color:var(--bad); }
.cols { display:flex; gap:14px; margin-top:8px; flex-wrap:wrap; }
.img { flex:0 0 380px; max-width:380px; }
.img img { width:100%; border:1px solid var(--line); border-radius:8px; background:#fff; }
.dec { flex:1 1 320px; font-size:14px; }
.dec table { border-collapse:collapse; width:100%; }
.dec td, .dec th { border-bottom:1px solid var(--line); text-align:left; padding:4px 6px; vertical-align:top; }
.dec th { color:var(--muted); font-weight:600; white-space:nowrap; }
.refs { font-family:ui-monospace,Menlo,monospace; font-size:12.5px; }
.qpane { margin-top:10px; border:1px solid var(--line); border-radius:8px; padding:8px 12px; background:#fbfcfd; }
.qpane .stem { white-space:pre-wrap; margin:0 0 8px; font-size:14.5px; }
.qpane .opts { list-style:none; margin:0; padding:0; }
.qpane .opts li { display:flex; gap:8px; padding:3px 0; font-size:14px; }
.qpane .opts li.ans { font-weight:600; }
.qpane .opts .k { flex:0 0 18px; }
.qpane .ans-key { font-size:12.5px; color:var(--ok); font-weight:600; margin-top:4px; }
.qpane .fail { color:var(--bad); font-size:13px; }
.qpane summary { cursor:pointer; color:var(--muted); font-size:12.5px; }
.qpane[open] summary { margin-bottom:6px; }
.warn { color:var(--bad); }
.act { display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap; }
button { font:inherit; padding:5px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
.approve { border-color:var(--ok); color:var(--ok); font-weight:600; }
.returnb { border-color:var(--bad); color:var(--bad); font-weight:600; }
input.t { flex:1 1 220px; padding:5px 9px; border:1px solid var(--line); border-radius:8px; }
.hint { color:var(--muted); font-size:12.5px; }
.more { display:block; margin:6px auto 30px; }
</style>
</head>
<body>
<header>
  <h1>核圖草案（634 題）<span class="hint">每張卡：看左邊的圖，判斷它屬不屬於這一題——屬於按 ✅，不屬於按 ↩（寫一句理由）</span>
    <a href="/" style="margin-left:auto;font-size:13px;color:var(--accent);text-decoration:none">← 回主頁</a></h1>
  <div class="chips" id="chips"></div>
  <div class="hint" id="stats" style="margin-top:6px;"></div>
  <div class="hint" style="margin-top:2px;">這裡的裁決寫進 agent 的學習檔（agent_feedback.jsonl）；<b>不寫人審帳本</b>——正式審題請用主頁右上角的 v2 審題站。</div>
</header>
<main id="cards"></main>
<button class="more" id="more">載入更多</button>
<script>
let ALL = [], STATE = { shown: 0, filter: "未判" };
const CHUNK = 25;

async function api(path, body) {
  const res = await fetch(path, body ? { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) } : undefined);
  return res.json();
}

function counts() {
  const pass = ALL.filter(d => d.ruling === "pass").length;
  const ret = ALL.filter(d => d.ruling === "return").length;
  const unc = ALL.filter(d => !d.ruling).length;
  const split = ALL.filter(d => d.agreed === false).length;
  return { pass, ret, unc, split };
}

function chips() {
  const c = counts();
  const defs = [
    ["未判", d => !d.ruling, `未判 ${c.unc}`],
    ["已通過", d => d.ruling === "pass", `已通過 ${c.pass}`],
    ["已退回", d => d.ruling === "return", `已退回 ${c.ret}`],
    ["兩輪不一致", d => d.agreed === false, `不一致 ${c.split}`],
    ["全部", () => true, `全部 ${ALL.length}`],
  ];
  const box = document.getElementById("chips");
  box.innerHTML = "";
  defs.forEach(([name, fn, label]) => {
    const b = document.createElement("button");
    b.className = "chip" + (STATE.filter === name ? " on" : "");
    b.textContent = label;
    b.onclick = () => { STATE.filter = name; STATE.shown = 0; document.getElementById("cards").innerHTML = ""; render(); chips(); };
    box.appendChild(b);
  });
}

function questionPane(el, key) {
  // owner 2026-10-02:「沒有看到整題，無法判斷對錯」。The question loads per card from the
  // main page's own `/api/question` — the same组装 the 主頁 renders from, so 判讀對象一致.
  // The placeholder is honest (`載入中…`); a failed load says so and names the fallback link.
  const box = document.createElement("details");
  box.className = "qpane"; box.open = true;
  box.innerHTML = `<summary>整題</summary><div class="fail">載入中…</div>`;
  el.appendChild(box);
  api("/api/question?key=" + encodeURIComponent(key)).then((q) => {
    const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const stemHtml = q.stem_html || "";
    const stem = stemHtml || esc(q.stem || "（題幹是空的）");
    const keys = new Set((q.answer_keys || (q.answer ? [q.answer] : [])).map((a) => String(a).toUpperCase()));
    const opts = (q.options || []).map((o) => {
      if (o && typeof o === "object") {
        const k = String(o.key ?? o.label ?? "").toUpperCase();
        const cached = (q.options_html || []).find((h) => h.key === k);
        const body = cached && cached.text_html ? cached.text_html : esc(o.text ?? o.value ?? "");
        return `<li class="${keys.has(k) ? "ans" : ""}"><span class="k">${esc(k)}.</span><span>${body}</span></li>`;
      }
      return `<li><span class="k">·</span><span>${esc(o)}</span></li>`;
    }).join("");
    box.innerHTML = `<summary>整題（${esc(q.subject || "")} · q${esc(q.question_number ?? "?")}）</summary>
      <div class="stem">${stem}</div>
      ${opts ? `<ul class="opts">${opts}</ul>` : ""}
      ${keys.size ? `<div class="ans-key">正確答案：${[...keys].join("、")}</div>` : ""}`;
    // v2 深鏈在回應裡（主頁同一支組裝）；有就補一顆，沒有就不出現。
    if (q.v2_url) {
      const a = document.createElement("a");
      a.href = q.v2_url; a.target = "_blank"; a.rel = "noopener";
      a.style.cssText = "color:var(--accent);text-decoration:none";
      a.textContent = "在 v2 開這一題 ↗";
      el.querySelector(".k").append(" ", a);
    }
  }).catch((e) => { box.innerHTML = `<summary>整題</summary><div class="fail">載入失敗（${esc(String(e).slice(0,80))}）——用上面的「主頁看這題」開。</div>`; });
}

function card(d) {
  const el = document.createElement("div");
  el.className = "card" + (d.ruling === "pass" ? " done-ok" : d.ruling === "return" ? " no-bad" : "");
  const cropTag = d.crops.length
    ? d.crops.map(p => `<img loading="lazy" src="/file?path=${encodeURIComponent(p)}" alt="crop">`).join("")
    : `<span class="warn">找不到裁片路徑（工單 join 缺）</span>`;
  const rounds = [d.a, d.b].filter(Boolean).map(r => `
    <tr><th>輪 ${r.tag || "?"}</th><td>
      <b>${r.decision === "insert" ? "插入" : r.decision === "none" ? "不用圖" : r.degraded ? "⚠ degraded" : (r.decision || "?")}</b>
      refs：<span class="refs">${(r.refs || []).join(", ") || "—"}</span><br>
      插哪：${r.where || "—"}<br>
      依據：${r.basis || "—"}
    </td></tr>`).join("");
  const badges = [ d.agreed === true ? `<span class="badge agree">兩輪一致</span>` :
                   d.agreed === false ? `<span class="badge split">兩輪不一致</span>` : "",
                   d.ruling === "pass" ? `<span class="badge ruling-pass">你判：通過</span>` :
                   d.ruling === "return" ? `<span class="badge ruling-return">你判：退回</span>` : "" ].join("");
  el.innerHTML = `
    <div class="k">${d.key} ${badges} <a href="/?key=${encodeURIComponent(d.key)}" style="color:var(--accent);text-decoration:none">🔎 主頁看這題（題目＋官方卷）</a></div>
    <div class="cols"><div class="img">${cropTag}</div>
    <div class="dec"><table>${rounds}</table></div></div>`;
  questionPane(el, d.key);
  const act = document.createElement("div");
  act.className = "act";
  act.innerHTML = `
      <button class="approve">✅ 這個 refs 提法是對的</button>
      <button class="returnb">↩ 不對（退回）</button>
      <input class="t" placeholder="退回理由（例：這是別題的圖）">
      ${d.ruling ? `<span class="hint">已判（${d.ruling}）——再按會追加一筆新裁決</span>` : `<span class="hint">判讀＝設計者動作，append-only</span>`}`;
  el.appendChild(act);
  const [approve, ret, reason] = [el.querySelector(".approve"), el.querySelector(".returnb"), el.querySelector(".t")];
  const decide = (rating, review) => async () => {
    for (const b of [approve, ret]) b.disabled = true;
    const body = {
      key: d.key, rating,
      reason: (reason.value || "").slice(0, 400) || (review === "pass" ? "figure refs 提法正確" : ""),
      engine: "human:designer", source: "designer", audit_scope: "figure_ref",
      question_number: d.key.split(":").pop(),
      extras: { figure_review: review, refs: (d.a.refs || []).join(";"), decision_a: d.a.decision || "", decision_b: d.b.decision || "" },
    };
    const out = await api("/api/judgement", body);
    if (out.error) { reason.value = "錯誤：" + out.error; for (const b of [approve, ret]) b.disabled = false; return; }
    el.classList.add(review === "pass" ? "done-ok" : "no-bad");
    if (review !== "pass") reason.value = "已退回：" + (reason.value || "（無理由）");
    for (const b of [approve, ret]) b.remove();
    d.ruling = review; chips();
  };
  approve.onclick = decide("up", "pass");
  ret.onclick = decide("down", "return");
  return el;
}

function render() {
  const fns = { "未判": d => !d.ruling, "已通過": d => d.ruling === "pass", "已退回": d => d.ruling === "return",
                "兩輪不一致": d => d.agreed === false, "全部": () => true };
  const fn = fns[STATE.filter] || (() => true);
  const list = ALL.filter(fn);
  const next = list.slice(STATE.shown, STATE.shown + CHUNK);
  next.forEach(d => document.getElementById("cards").appendChild(card(d)));
  STATE.shown += next.length;
  document.getElementById("more").style.display = STATE.shown >= list.length ? "none" : "block";
  document.getElementById("stats").textContent =
    `總計 ${ALL.length}　通過 ${counts().pass}　退回 ${counts().ret}　未判 ${counts().unc}`;
}

(async () => {
  const data = await api("/api/figure");
  ALL = data.drafts || [];
  chips(); render();
  document.getElementById("more").onclick = render;
})();
</script>
</body>
</html>
