<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a43">
  <title>ReviewUI · 例外工作台</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #102a43;
      --muted: #627d98;
      --canvas: #f5f7fa;
      --paper: #ffffff;
      --line: #d9e2ec;
      --line-strong: #bcccdc;
      --navy: #102a43;
      --blue: #1976d2;
      --blue-soft: #e8f1fb;
      --green: #087f5b;
      --green-soft: #e6f6f0;
      --amber: #a15c00;
      --amber-soft: #fff3d6;
      --red: #b42318;
      --red-soft: #ffebe9;
      --purple: #6941c6;
      --purple-soft: #f2eaff;
      --shadow: 0 12px 32px rgba(16, 42, 67, .07);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      color: var(--ink);
      background: var(--canvas);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      min-height: 66px; padding: 10px 18px;
      border-bottom: 1px solid var(--line); background: rgba(255,255,255,.94);
      backdrop-filter: blur(16px);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--navy); color: white; font-size: 17px; font-weight: 900; }
    .brand-title { font-size: 16px; font-weight: 860; letter-spacing: -.02em; }
    .brand-subtitle { color: var(--muted); font-size: 11px; }
    .top-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; color: var(--muted); font-size: 11px; }
    .pill, .tag { display: inline-flex; align-items: center; min-height: 24px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px; background: #f8fafc; white-space: nowrap; }
    .pill.staging { border-color: #b7d8cc; background: var(--green-soft); color: var(--green); font-weight: 800; }
    .pill.advisory { border-color: #e6c977; background: var(--amber-soft); color: var(--amber); font-weight: 800; }
    .pill.model { border-color: #b9cdf8; background: var(--blue-soft); color: #175cd3; }
    .top-actions { display: flex; gap: 7px; }
    .top-actions a, .top-actions button { min-height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: white; color: var(--ink); text-decoration: none; font-size: 12px; font-weight: 750; }
    .top-actions button.primary { border-color: var(--navy); background: var(--navy); color: white; }
    .run-strip { width: 100%; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .run-strip code { color: var(--ink); }

    .metrics { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; padding: 14px 18px 0; }
    .metric { min-height: 82px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); box-shadow: var(--shadow); }
    .metric-label { color: var(--muted); font-size: 11px; font-weight: 750; }
    .metric-value { margin-top: 5px; font-size: 24px; font-weight: 880; letter-spacing: -.04em; }
    .metric-note { margin-top: 2px; color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .metric.warning .metric-value { color: var(--amber); }
    .metric.danger .metric-value { color: var(--red); }
    .metric.good .metric-value { color: var(--green); }

    .app { display: grid; grid-template-columns: 262px minmax(500px, 1fr) 390px; gap: 12px; min-height: calc(100vh - 178px); padding: 14px 18px 22px; }
    .rail, .detail, .evidence-panel { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); box-shadow: var(--shadow); }
    .rail { display: flex; flex-direction: column; min-height: 680px; overflow: hidden; }
    .rail-head { padding: 14px; border-bottom: 1px solid var(--line); }
    .rail-head h2 { margin: 0; font-size: 14px; }
    .rail-head p { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .search { width: 100%; height: 34px; margin-top: 11px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px; outline: none; }
    .search:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(25,118,210,.12); outline: none; }
    .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
    select { min-width: 0; height: 31px; padding: 0 6px; border: 1px solid var(--line); border-radius: 7px; background: white; color: var(--ink); font-size: 11px; }
    .queue-nav { padding: 9px; overflow: auto; }
    .queue-button { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 8px; align-items: center; width: 100%; min-height: 50px; margin-bottom: 5px; padding: 8px 9px; border: 1px solid transparent; border-radius: 10px; background: white; color: var(--ink); text-align: left; }
    .queue-button:hover { background: #f7faff; border-color: var(--line); }
    .queue-button.active { border-color: #8fb5e8; background: var(--blue-soft); }
    .queue-icon { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: #edf2f7; color: var(--muted); font-size: 12px; font-weight: 900; }
    .queue-button.active .queue-icon { background: var(--blue); color: white; }
    .queue-name { overflow: hidden; font-size: 12px; font-weight: 820; text-overflow: ellipsis; white-space: nowrap; }
    .queue-description { margin-top: 2px; color: var(--muted); font-size: 10px; line-height: 1.25; }
    .queue-count { min-width: 26px; padding: 3px 6px; border-radius: 999px; background: #edf2f7; color: var(--ink); font-size: 11px; font-weight: 850; text-align: center; }
    .queue-button.active .queue-count { background: white; color: var(--blue); }
    .queue-total { margin: 0 14px 11px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .queue-items { flex: 1; overflow: auto; border-top: 1px solid var(--line); }
    .item-button { display: block; width: 100%; padding: 10px 12px; border: 0; border-bottom: 1px solid #edf2f7; background: white; color: var(--ink); text-align: left; }
    .item-button:hover { background: #f8fbff; }
    .item-button.active { background: #eef5ff; box-shadow: inset 3px 0 0 var(--blue); }
    .item-line { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .item-title { overflow: hidden; font-size: 12px; font-weight: 820; text-overflow: ellipsis; white-space: nowrap; }
    .item-meta { margin-top: 4px; color: var(--muted); font-size: 10px; line-height: 1.35; }
    .item-reason { margin-top: 4px; color: var(--amber); font-size: 10px; line-height: 1.35; }

    .detail { min-height: 680px; padding: 0; overflow: hidden; }
    .detail-scroll { height: 100%; overflow: auto; padding: 16px; }
    .empty { display: grid; place-items: center; min-height: 600px; padding: 30px; color: var(--muted); text-align: center; }
    .empty strong { display: block; margin-bottom: 8px; color: var(--ink); font-size: 17px; }
    .detail-head { display: flex; align-items: flex-start; gap: 10px; padding-bottom: 13px; border-bottom: 1px solid var(--line); }
    .detail-title { min-width: 0; margin-right: auto; }
    .detail-title h1 { margin: 0; font-size: 20px; letter-spacing: -.03em; }
    .detail-title p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .detail-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .decision { min-height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: white; color: var(--ink); font-size: 11px; font-weight: 820; }
    .decision.accept { border-color: #91d5bd; background: var(--green-soft); color: var(--green); }
    .decision.hold { border-color: #e6c977; background: var(--amber-soft); color: var(--amber); }
    .decision.block { border-color: #efaaa4; background: var(--red-soft); color: var(--red); }
    .decision.exclude { color: var(--muted); }
    .section { margin-top: 14px; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
    .section-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: #fbfcfe; }
    .section-head h2 { margin: 0; font-size: 13px; }
    .section-head .meta { margin-left: auto; color: var(--muted); font-size: 10px; }
    .section-body { padding: 12px; }
    .question-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; font-weight: 650; line-height: 1.6; }
    .option-row { display: grid; grid-template-columns: 31px minmax(0, 1fr); gap: 8px; margin-top: 9px; line-height: 1.5; }
    .option-key { color: var(--blue); font-weight: 900; }
    .option-text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
    .answer-line { margin-top: 12px; padding-top: 9px; border-top: 1px dashed var(--line-strong); color: var(--green); font-size: 12px; font-weight: 800; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
    .tag.queue { border-color: #a9c8ee; background: var(--blue-soft); color: #175cd3; font-weight: 800; }
    .tag.error { border-color: #efaaa4; background: var(--red-soft); color: var(--red); }
    .tag.warning { border-color: #e6c977; background: var(--amber-soft); color: var(--amber); }
    .tag.good { border-color: #a9ddc9; background: var(--green-soft); color: var(--green); }
    .tag.neutral { color: var(--muted); }
    .lane-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; }
    .lane-card { min-width: 0; padding: 9px; border: 1px solid var(--line); border-radius: 9px; background: white; }
    .lane-card.finding, .lane-card.failed { border-color: #efaaa4; background: #fffafa; }
    .lane-card.machine_pass { border-color: #a9ddc9; background: #fbfffd; }
    .lane-card.skipped { background: #f8fafc; }
    .lane-name { font-size: 11px; font-weight: 850; }
    .lane-status { margin-top: 5px; font-size: 11px; font-weight: 800; }
    .lane-card.finding .lane-status, .lane-card.failed .lane-status { color: var(--red); }
    .lane-card.machine_pass .lane-status { color: var(--green); }
    .lane-meta { margin-top: 5px; color: var(--muted); font-size: 9px; line-height: 1.35; }
    .lane-detail { margin-top: 8px; padding-top: 7px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 10px; line-height: 1.45; }
    .lane-detail code { display: inline-block; max-width: 100%; overflow-wrap: anywhere; color: var(--ink); }
    .finding { margin-top: 7px; padding: 9px; border: 1px solid #f0c8c4; border-radius: 8px; background: #fffafa; }
    .finding strong { color: var(--red); font-size: 11px; }
    .finding p { margin: 4px 0 0; font-size: 11px; line-height: 1.45; }
    .finding .finding-meta { margin-top: 5px; color: var(--muted); font-size: 10px; }
    .revision-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .kv { min-width: 0; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfe; }
    .kv-label { color: var(--muted); font-size: 10px; }
    .kv-value { margin-top: 4px; overflow-wrap: anywhere; color: var(--ink); font-size: 11px; font-weight: 750; }
    .diff { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 9px; }
    .diff-box { min-width: 0; padding: 9px; border-radius: 8px; font-size: 11px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
    .diff-box.before { border: 1px solid #efaaa4; background: var(--red-soft); }
    .diff-box.after { border: 1px solid #a9ddc9; background: var(--green-soft); }
    .diff-label { margin-bottom: 5px; font-size: 10px; font-weight: 850; }
    .notes { width: 100%; min-height: 75px; resize: vertical; padding: 9px; border: 1px solid var(--line-strong); border-radius: 8px; line-height: 1.45; }
    .edit-grid { display: grid; gap: 9px; }
    .edit-field { display: grid; gap: 5px; }
    .edit-field label { color: var(--muted); font-size: 10px; font-weight: 820; }
    .edit-field input, .edit-field textarea { width: 100%; padding: 8px; border: 1px solid var(--line-strong); border-radius: 8px; background: white; color: var(--ink); line-height: 1.45; }
    .edit-field textarea { min-height: 86px; resize: vertical; }
    .edit-field textarea.options-editor { min-height: 150px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .edit-help { color: var(--muted); font-size: 10px; line-height: 1.45; }
    .feedback-card { margin-top: 9px; padding: 9px; border: 1px solid #cdb8f5; border-radius: 8px; background: var(--purple-soft); }
    .feedback-card strong { color: var(--purple); font-size: 11px; }
    .feedback-card p { margin: 5px 0 0; color: var(--ink); font-size: 10px; line-height: 1.45; }
    .feedback-diff { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 7px; }
    .feedback-diff .diff-box { font-size: 10px; }
    .decision-note { margin-top: 7px; color: var(--muted); font-size: 10px; line-height: 1.4; }

    .evidence-panel { min-height: 680px; overflow: hidden; }
    .evidence-scroll { height: 100%; overflow: auto; padding: 14px; }
    .evidence-scroll h2 { margin: 0; font-size: 14px; }
    .evidence-scroll > p { margin: 5px 0 12px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .evidence-state { padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: #fbfcfe; }
    .evidence-state strong { font-size: 12px; }
    .evidence-state p { margin: 5px 0 0; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .evidence-state.auto { border-color: #a9ddc9; background: var(--green-soft); }
    .evidence-state.conflict { border-color: #e6c977; background: var(--amber-soft); }
    .engine-list { display: grid; gap: 7px; margin-top: 10px; }
    .engine { padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: white; }
    .engine-head { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 10px; font-weight: 800; }
    .engine-text { margin-top: 5px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; line-height: 1.45; }
    .visual-preview { display: grid; gap: 7px; margin-top: 10px; }
    .visual-preview img { display: block; width: 100%; max-height: 230px; object-fit: contain; border: 1px solid var(--line); border-radius: 8px; background: #f8fafc; }
    .visual-caption { color: var(--muted); font-size: 10px; }
    .pdf-source { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
    .pdf-source button { min-height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 7px; background: white; color: var(--ink); font-size: 10px; font-weight: 750; }
    .pdf-frame { width: 100%; height: 260px; margin-top: 9px; border: 1px solid var(--line); border-radius: 8px; background: #eef2f6; }
    .path { margin-top: 5px; color: var(--muted); font-size: 9px; overflow-wrap: anywhere; }
    .path code { color: var(--ink); }
    .hidden { display: none !important; }
    .loading { padding: 40px; color: var(--muted); text-align: center; }
    .toast { position: fixed; right: 18px; bottom: 18px; z-index: 30; max-width: min(420px, calc(100vw - 36px)); padding: 11px 14px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--navy); color: white; box-shadow: var(--shadow); font-size: 12px; }
    .toast.error { background: var(--red); }
    @media (max-width: 1260px) {
      .app { grid-template-columns: 242px minmax(470px, 1fr); }
      .evidence-panel { grid-column: 1 / -1; min-height: 360px; }
      .evidence-scroll { height: auto; }
      .evidence-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    }
    @media (max-width: 820px) {
      .topbar { padding: 9px 11px; }
      .brand { width: 100%; }
      .top-actions { margin-left: auto; }
      .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 10px 11px 0; }
      .metric { min-height: 72px; padding: 9px; }
      .metric-value { font-size: 20px; }
      .app { display: block; padding: 10px 11px 18px; }
      .rail { min-height: auto; margin-bottom: 10px; }
      .queue-nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); max-height: 245px; }
      .queue-items { max-height: 260px; }
      .detail, .evidence-panel { min-height: auto; margin-bottom: 10px; }
      .detail-scroll, .evidence-scroll { height: auto; }
      .lane-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .detail-head { display: block; }
      .detail-actions { justify-content: flex-start; margin-top: 10px; }
      .evidence-layout { display: block; }
    }
    @media (max-width: 500px) {
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .queue-nav { grid-template-columns: 1fr; }
      .revision-grid, .diff, .feedback-diff { grid-template-columns: 1fr; }
      .question-text { font-size: 15px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">審</div>
      <div><div class="brand-title">ReviewUI · 例外工作台</div><div class="brand-subtitle">revision / lane / evidence console</div></div>
    </div>
    <div id="runBadges" class="top-meta"></div>
    <div class="top-actions">
      <a href="/mobile/workflow/">手機快審</a>
      <a href="/legacy/">舊版退路</a>
      <button onclick="refreshFeedbackOutbox()">護欄 outbox</button>
      <button class="primary" onclick="reloadWorkflow()">重新讀取</button>
    </div>
    <div id="runStrip" class="run-strip">載入 staging run…</div>
  </header>
  <section id="metrics" class="metrics"></section>
  <main class="app">
    <aside class="rail">
      <div class="rail-head">
        <h2>互斥人工 queue</h2>
        <p>每題只進一個主要 queue；其他 lane 留在題目時間線，不重複佔用人工清單。</p>
        <input id="search" class="search" placeholder="搜尋題號、題幹、原因或 key" autocomplete="off">
        <div class="filters">
          <select id="categoryFilter" aria-label="考別"><option value="">全部考別</option></select>
          <select id="yearFilter" aria-label="年份"><option value="">全部年份</option></select>
          <select id="subjectFilter" aria-label="科目"><option value="">全部科目</option></select>
          <select id="severityFilter" aria-label="嚴重度"><option value="">全部嚴重度</option><option value="error">阻擋／錯誤</option><option value="warning">提醒</option><option value="info">抽樣</option></select>
        </div>
      </div>
      <nav id="queueNav" class="queue-nav"></nav>
      <div id="queueTotal" class="queue-total"></div>
      <div id="queueItems" class="queue-items"></div>
    </aside>
    <section id="detail" class="detail"><div class="loading">讀取工作流資料…</div></section>
    <aside id="evidencePanel" class="evidence-panel"><div class="evidence-scroll"><div class="loading">等待題目</div></div></aside>
  </main>
  <div id="toast" class="toast hidden"></div>
<script>
  const LANES = ['answer', 'group', 'notation', 'text_evidence', 'vision'];
  const LANE_LABELS = {answer:'答案', group:'題組', notation:'上下標／字形', text_evidence:'文字三證據', vision:'圖片'};
  const STATUS_LABELS = {finding:'發現疑點', failed:'執行失敗', machine_pass:'機器通過', skipped:'不適用', pass:'通過', needs_review:'需人工', block:'阻擋', unknown:'未知'};
  const QUEUE_ICONS = {source:'S', answer:'A', vision:'V', group:'G', notation:'N', text:'T', revision:'R', sample:'✓'};
  const state = {data:null, selectedKey:'', activeQueue:'source', search:'', category:'', year:'', subject:'', severity:'', feedbackOutbox:null};
  let toastTimer = null;

  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  // Inline handlers live inside a double-quoted HTML attribute.  Encode the
  // JSON string for the attribute, then the browser decodes it back to valid
  // JavaScript before dispatching the click.
  const jsArg = value => JSON.stringify(String(value ?? '')).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const fmt = value => Number.isFinite(Number(value)) ? Number(value).toLocaleString('zh-TW') : esc(value || '—');
  const statusLabel = value => STATUS_LABELS[String(value || '')] || String(value || '—');
  const fileUrl = path => path ? `/file?path=${encodeURIComponent(path)}` : '';
  const editorJson = value => JSON.stringify(value ?? [], null, 2);
  const prettyValue = value => {
    if (value === undefined) return '（未提供）';
    if (value === null) return 'null';
    return typeof value === 'object' ? JSON.stringify(value, null, 2) : String(value);
  };
  const visibleQueueItems = () => {
    const data = state.data || {};
    const query = state.search.trim().toLowerCase();
    return (data.queue_items || []).filter(item => {
      if (item.primary_queue !== state.activeQueue) return false;
      if (state.category && item.category !== state.category) return false;
      if (state.year && item.year !== state.year) return false;
      if (state.subject && item.subject !== state.subject) return false;
      if (state.severity && item.severity !== state.severity) return false;
      if (!query) return true;
      return [item.candidate_key, item.question_number, item.category, item.subject, item.stem_preview, ...(item.reason_codes || [])].join(' ').toLowerCase().includes(query);
    });
  };
  function showToast(message, error = false) {
    const node = document.getElementById('toast');
    node.textContent = message;
    node.className = `toast${error ? ' error' : ''}`;
    clearTimeout(toastTimer);

  async function reloadWorkflow() { await loadWorkflow(state.selectedKey); showToast('已重新讀取 queue、lane 與 evidence'); }
  function chooseQueue(queue) {
    state.activeQueue = queue;
    const item = visibleQueueItems()[0];
    state.selectedKey = item?.candidate_key || '';
    loadWorkflow(state.selectedKey);
  }
  async function selectItem(key) { state.selectedKey = key; await loadWorkflow(key); }
  function focusEvidence() { document.getElementById('evidencePanel')?.scrollIntoView({behavior:'smooth', block:'start'}); }
  function openPdf(kind) {
    const candidate = state.data?.selected?.candidate;
    const path = candidate?.source_files?.[kind];
    if (!path) { showToast('本題沒有這個來源 PDF', true); return; }
    const frame = document.getElementById('pdfFrame');
    if (frame) frame.src = fileUrl(path);
    const label = document.getElementById('pdfPath');
    if (label) label.innerHTML = `<code>${esc(path)}</code>`;
  }
  async function saveDecision(action) {
    const candidate = state.data?.selected?.candidate;
    if (!candidate) return;
    const notes = document.getElementById('decisionNotes')?.value?.trim() || '';
    if (action !== 'accept' && !notes) { showToast('保留疑問／阻擋／排除請留下原因，方便後續修 rule', true); return; }
    try {
      const response = await fetch('/api/review', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({candidate_key:candidate.candidate_key, action, notes, reviewer:'local', source:'workflow_console'})});
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || `HTTP ${response.status}`);
      showToast(`已寫入 ${action}；保留 append-only event，重新排序 queue`);
      await loadWorkflow(candidate.candidate_key);
    } catch (error) { showToast(`寫入失敗：${error.message || error}`, true); }
  }
  async function saveCorrection() {
    const candidate = state.data?.selected?.candidate;
    if (!candidate) return;
    const stem = document.getElementById('correctionStem')?.value ?? '';
    const optionsText = document.getElementById('correctionOptions')?.value ?? '[]';
    const answerText = document.getElementById('correctionAnswer')?.value ?? '';
    const groupRef = document.getElementById('correctionGroupRef')?.value ?? '';
    const notes = document.getElementById('correctionNotes')?.value?.trim() || '';
    let options;
    try {
      options = JSON.parse(optionsText);
    } catch (error) {
      showToast(`選項 JSON 格式錯誤：${error.message || error}`, true);
      return;
    }
    if (!Array.isArray(options)) { showToast('選項 JSON 必須是陣列', true); return; }
    const correction = {stem, options, answer: answerText, group_ref: groupRef};
    try {
      const response = await fetch('/api/review', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          candidate_key: candidate.candidate_key,
          action: 'correct',
          correction,
          notes,
          reviewer: 'local',
          source: 'workflow_console',
          review_surface: 'desktop_workflow',
        }),
      });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || `HTTP ${response.status}`);
      const feedbackId = data.event?.storage?.correction_feedback?.event?.feedback_id;
      showToast(feedbackId ? `修正已保存，feedback ${feedbackId}` : '修正已保存；沒有可建立的可見差異 feedback');
      await loadWorkflow(candidate.candidate_key);
    } catch (error) { showToast(`修正保存失敗：${error.message || error}`, true); }
  }
  function installEvents() {
    for (const id of ['categoryFilter','yearFilter','subjectFilter','severityFilter']) document.getElementById(id).addEventListener('change', event => { state[id.replace('Filter','')] = event.target.value; renderQueueNav(); });
    let searchTimer;
    document.getElementById('search').addEventListener('input', event => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { state.search = event.target.value; renderQueueNav(); }, 160); });
  }
  installEvents();
  loadWorkflow();
</script>
</body>
</html>
