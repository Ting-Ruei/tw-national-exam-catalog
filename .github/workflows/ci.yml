name: governance-and-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: governance-and-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate agent governance and repository boundaries
        run: python3 scripts/validate_agent_governance.py
      - name: Compile critical Python entrypoints
        run: python3 -m py_compile scripts/serve_question_review_ui.py scripts/build_question_candidates_from_mineru.py scripts/validate_agent_governance.py
      - name: Check production shell syntax
        run: bash -n scripts/ai395_catalog_runtime.sh scripts/ai395_catalog_production.sh

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run unit tests
        run: python3 -m unittest discover -s tests
